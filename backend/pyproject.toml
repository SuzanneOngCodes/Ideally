[project]
name = "ideally-backend"
version = "0.1.0"
description = "Session and research API powered by LangChain Deep Agents and Gemini"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "deepagents>=0.4,<1", "langchain>=1,<2", "langchain-core>=1,<2", "langchain-google-genai>=4,<5",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
